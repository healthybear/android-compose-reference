name: Cross-platform build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python for font subsetting
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FontTools
        run: python -m pip install fonttools

      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web and Wasm
        run: pnpm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ runner.os }}
          path: web/dist
          if-no-files-found: error
          retention-days: 7
